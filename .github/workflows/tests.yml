name: tests

on:
  push:
  pull_request:

jobs:
  # The physics core must work without Qt (spec section 1): GUI tests skip here.
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package (core only)
        run: |
          pip install -e .
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -m "not perf" -ra

  # Full suite including the Qt GUI tests, rendered offscreen.
  gui:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package with app and dev extras
        run: |
          pip install -e ".[app,dev]"
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -m "not perf" -ra
