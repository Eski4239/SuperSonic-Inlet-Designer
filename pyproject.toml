[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supersonic-inlet-designer"
version = "0.1.0"
description = "2D external-compression supersonic inlet design tool"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ezdxf",
]

[project.optional-dependencies]
app = ["PySide6>=6.10", "pyqtgraph>=0.13"]
dev = ["pytest", "pytest-qt"]

[project.scripts]
inletdesign = "inletdesign.cli:main"
busemann = "busemann.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busemann = [
    "theme/*.tmpl",
    "resources/fonts/*.ttf",
    "resources/fonts/*.txt",
    "resources/icons/*.svg",
]

[tool.pytest.ini_options]
markers = ["gui: GUI smoke tests (pytest-qt); skipped when PySide6 or a display is unavailable"]
